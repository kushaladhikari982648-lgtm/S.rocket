name: Build Android APK

on:
  push:
    branches: [ arena/75781f06-s-rocket ]
    paths:
      - 'index.html'
      - 'game.js'
      - 'src/**'
      - 'package.json'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the game bundle
        run: |
          npm install --no-audit --no-fund
          npm run build
          ls -lh game.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/S.Rocket-Bus-Sim.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: s-rocket-apk
          path: dist/S.Rocket-Bus-Sim.apk
          if-no-files-found: error

      # Publish the built APK back into the repo so it can be downloaded with a plain
      # link (raw.githubusercontent.com) without a GitHub login.
      - name: Publish APK to dist/
        run: |
          git config user.name "S.Rocket CI"
          git config user.email "ci@users.noreply.github.com"
          git add -f dist/S.Rocket-Bus-Sim.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "chore(dist): publish APK build [skip ci]"
            git push
          fi
