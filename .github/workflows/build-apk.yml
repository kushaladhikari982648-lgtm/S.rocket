name: Build Android APK

on:
  push:
    branches: [ arena/75781f06-s-rocket ]
    paths:
      - 'index.html'
      - 'game.js'
      - 'src/**'
      - 'package.json'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the game bundle
        run: |
          npm install --no-audit --no-fund
          npm run build
          ls -lh game.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/S.Rocket-Bus-Sim.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: s-rocket-apk
          path: dist/S.Rocket-Bus-Sim.apk
          if-no-files-found: error
